<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>index.html</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#111111;--sf:#1C1C1C;--tx:#FFFFFF;--mu:#a3a3a3;--ln:#2c2c2c;--red:#DA291C;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#FFFFFF;--sf:#F3F3F3;--tx:#111111;--mu:#5b5b5b;--ln:#e2e2e2;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111111;--sf:#1C1C1C;--tx:#FFFFFF;--mu:#a3a3a3;--ln:#2c2c2c}}
:root[data-theme="dark"]{--bg:#111111;--sf:#1C1C1C;--tx:#FFFFFF;--mu:#a3a3a3;--ln:#2c2c2c}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:400 15px/1.45 Barlow,system-ui,sans-serif;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,h3{font-family:"Barlow Condensed",Impact,sans-serif;margin:0;line-height:1}
main{max-width:760px;margin:0 auto;padding:18px 16px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:14px}
.stack>*+*{margin-top:12px}
.hero{background:linear-gradient(135deg,#DA291C,#8f130b);color:#fff;border-radius:26px;padding:26px}
.hero h1{font-size:clamp(44px,13vw,76px);font-weight:800}
.muted{color:var(--mu);font-size:13px}
.title{font-size:36px;font-weight:800;margin-bottom:12px}
.sub{font-size:22px;font-weight:800;margin:18px 0 8px}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.mrow{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:8px}
.mrow b{font-size:15px}.mrow .r{text-align:right}
.score{font:800 26px "Barlow Condensed",sans-serif;text-align:center;min-width:64px}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;background:#DA291C26;color:var(--red)}
.pill.d{background:#8883;color:var(--tx)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}
.chip{flex:none;border:1px solid var(--ln);background:none;color:var(--tx);border-radius:99px;padding:6px 14px;font:500 14px Barlow,sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;margin-top:12px}
.cd div{background:#0003;border-radius:12px;padding:8px 0}.cd b{display:block;font:800 30px "Barlow Condensed",sans-serif}.cd span{font-size:11px;opacity:.85}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;overflow-x:auto;background:var(--sf);border-top:1px solid var(--ln);padding:0 0 env(safe-area-inset-bottom,0px)}
.nav a{flex:1 0 72px;text-align:center;padding:8px 4px;color:var(--mu);text-decoration:none;font-size:11px;font-weight:600}
.nav a b{display:block;font-size:18px;font-weight:400}.nav a[aria-current="page"]{color:var(--red)}
.live-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--red);animation:p 1.4s infinite}
@keyframes p{50%{opacity:.3;transform:scale(.8)}}
@media (prefers-reduced-motion:reduce){.live-dot{animation:none}}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pl{display:flex;justify-content:space-between;align-items:center;padding:12px 14px}
.star{background:none;border:0;font-size:22px;color:var(--red);cursor:pointer;padding:4px 8px}
input[type=search],select{width:100%;background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;font:inherit}
.btn{background:var(--red);color:#fff;border:0;border-radius:99px;padding:10px 18px;font:600 15px Barlow,sans-serif;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 6px;text-align:right}td:nth-child(2),th:nth-child(2){text-align:left}tr+tr td{border-top:1px solid var(--ln)}tr.me{background:#DA291C33;font-weight:700}
.scroll{overflow-x:auto}
a{color:var(--red)}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
footer{text-align:center;color:var(--mu);font-size:12px;padding:8px 16px 20px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main id="app" class="stack" aria-live="polite"></main>
<footer>Made with passion by Rizza Nahrul Islam</footer>
<nav class="nav" id="nav" aria-label="Navigasi utama"></nav>
<script>
"use strict";
const AS_OF="18 November 2026";
const TABS=[["beranda","🏠","Beranda"],["jadwal","📅","Jadwal"],["live","🔴","Live"],["skuad","👕","Skuad"],["klasemen","🏆","Klasemen"],["hasil","✅","Hasil"],["berita","📰","Berita"],["favorit","⭐","Favorit"],["pengaturan","⚙️","Pengaturan"]];
const COMP={pl:"Premier League",ucl:"Liga Champions"};
const FIX=[
["2026-11-22T16:30:00Z","Liverpool","A","Anfield","pl"],["2026-11-25T20:00:00Z","Sporting CP","A","Estádio José Alvalade","ucl"],
["2026-11-28T15:00:00Z","Brentford","H","Old Trafford","pl"],["2026-12-02T20:00:00Z","Newcastle United","A","St James’ Park","pl"],
["2026-12-05T15:00:00Z","Coventry City","H","Old Trafford","pl"],["2026-12-08T20:00:00Z","RB Leipzig","H","Old Trafford","ucl"],
["2026-12-12T15:00:00Z","Crystal Palace","A","Selhurst Park","pl"],["2026-12-19T15:00:00Z","Arsenal","A","Emirates Stadium","pl"],
["2026-12-26T15:00:00Z","Nottingham Forest","H","Old Trafford","pl"],["2026-12-30T20:00:00Z","Sunderland","H","Old Trafford","pl"]
].map(([t,o,ha,v,c])=>({t:Date.parse(t),o,ha,v,c}));
const RES=[
{t:Date.parse("2026-11-08T16:30:00Z"),o:"Aston Villa",ha:"H",v:"Old Trafford",c:"pl",s:[4,4],note:"Dorgu menyamakan skor di menit 96."},
{t:Date.parse("2026-10-31T12:30:00Z"),o:"Chelsea",ha:"A",v:"Stamford Bridge",c:"pl",s:[0,2],note:"Gol: Rogers 50’, Palmer 64’ (pen)."},
{t:Date.parse("2026-10-25T14:00:00Z"),o:"Bournemouth",ha:"H",v:"Old Trafford",c:"pl",s:[0,3]},
{t:Date.parse("2026-10-21T12:00:00Z"),o:"Como",ha:"A",v:"Como",c:"ucl",s:[1,4],noTime:1}
];
const SQUAD=[["Senne Lammens","GK"],["Karl Darlow","GK"],["Diogo Dalot","DF"],["Noussair Mazraoui","DF"],["Matthijs de Ligt","DF"],["Luke Shaw","DF"],["Harry Maguire","DF"],["Leny Yoro","DF"],["Patrick Dorgu","DF"],["Bruno Fernandes","MF","Kapten"],["Carlos Baleba","MF"],["Mason Mount","MF"],["Andrey Santos","MF"],["Youri Tielemans","MF"],["Manuel Ugarte","MF"],["Kobbie Mainoo","MF"],["Marcus Rashford","FW"],["Matheus Cunha","FW"],["Bryan Mbeumo","FW"]];
const POS={GK:"Kiper",DF:"Bek",MF:"Gelandang",FW:"Penyerang"};
const NEWS=[
["Bangkit dua kali dari ketertinggalan dua gol, United menahan Villa 4-4","Match News","101greatgoals","https://www.101greatgoals.com/football/premier-league/manchester-united-4-4-aston-villa-remarkable-comeback-gives-carrick-valuable-point/"],
["Kabar United dekat kesepakatan dengan Mauricio Pochettino di tengah masa depan Carrick yang belum jelas","Club News","Times of Oman","https://timesofoman.com/article/179076-manchester-united-close-to-agreement-with-mauricio-pochettino-amid-uncertainty-over-coach-michael-carricks-future"],
["Tekanan pada Carrick bertambah setelah kalah 0-2 di Chelsea","Match News","Khaleej Times","https://www.khaleejtimes.com/sports/football/pressure-piles-on-man-uniteds-carrick-after-2-0-defeat-at-chelsea"]
];
const st=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let S={tz:st("mu-tz","Asia/Jakarta"),theme:st("mu-theme","dark"),favs:st("mu-favs",[]),comp:"all",month:"all",q:""};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const zl={"Asia/Jakarta":"WIB","Asia/Makassar":"WITA","Asia/Jayapura":"WIT","Europe/London":"London"};
const fm=(t,o)=>new Intl.DateTimeFormat("id-ID",{timeZone:S.tz,...o}).format(new Date(t));
const dt=t=>fm(t,{weekday:"short",day:"numeric",month:"short",year:"numeric"});
const tm=t=>fm(t,{hour:"2-digit",minute:"2-digit",hour12:false}).replace(".",":")+" "+zl[S.tz];
const mk=t=>fm(t,{year:"numeric",month:"2-digit"}),ml=t=>fm(t,{month:"long",year:"numeric"});
function applyTheme(){document.documentElement.setAttribute("data-theme",S.theme)}
function row(m,res){const home=m.ha==="H",a=home?"Manchester United":m.o,b=home?m.o:"Manchester United";
 const sc=res?(home?m.s:[m.s[1],m.s[0]]).join(" - "):"vs";
 return `<div class="card"><div class="row sp muted"><span>${COMP[m.c]}</span><span>${dt(m.t)}${m.noTime?"":", "+tm(m.t)}</span></div>
 <div class="mrow"><b>${esc(a)}</b><div class="score">${sc}</div><b class="r">${esc(b)}</b></div>
 <div class="row sp" style="margin-top:8px"><span class="pill ${res?"d":""}">${res?"Finished":"Upcoming"}</span><span class="muted">${esc(m.v)}</span></div>${m.note?`<p class="muted" style="margin:6px 0 0">${esc(m.note)}</p>`:""}</div>`}
function chips(items,cur,key){return `<div class="chips" role="group">${items.map(([k,l])=>`<button class="chip" aria-pressed="${cur===k}" data-set="${key}:${k}">${esc(l)}</button>`).join("")}</div>`}
const upcoming=()=>FIX.filter(f=>f.t>Date.now());
function cdHTML(){const n=upcoming()[0];if(!n)return"";const d=Math.max(0,n.t-Date.now()),p=x=>String(x).padStart(2,"0");
 return [["Hari",Math.floor(d/864e5)],["Jam",Math.floor(d/36e5)%24],["Menit",Math.floor(d/6e4)%60],["Detik",Math.floor(d/1e3)%60]].map(([l,v])=>`<div><b>${p(v)}</b><span>${l}</span></div>`).join("")}
const notice=`<p class="muted">Data per ${AS_OF}, dikumpulkan dari laporan media. Versi tautan ini tidak terhubung ke API langsung, jadi skor live dan pembaruan otomatis belum ada.</p>`;
const V={
beranda(){const n=upcoming()[0],l=RES[0];return `
 <section class="hero"><p class="muted" style="color:#fff9;margin:0 0 6px">Musim 2026/27</p><h1>MANCHESTER<br>UNITED<br>FANS PRO</h1><p style="margin:14px 0 0;font-size:13px;opacity:.85">oleh Rizza Nahrul Islam</p></section>
 ${n?`<section class="hero" style="padding:18px"><h2 style="font-size:24px">Pertandingan berikutnya</h2><p style="margin:8px 0 0">Manchester United ${n.ha==="H"?"vs":"@"} ${esc(n.o)}<br><span style="opacity:.85;font-size:13px">${COMP[n.c]} · ${dt(n.t)} · Kick-off ${tm(n.t)}</span></p><div class="cd" id="cd" role="timer">${cdHTML()}</div></section>`:`<div class="card">Belum ada jadwal berikutnya di data ini.</div>`}
 <h2 class="sub">Hasil terakhir</h2>${row(l,1)}
 <h2 class="sub">Posisi Premier League</h2><div class="card row sp"><div><span class="muted">Per 10 pertandingan</span><div style="font:800 44px 'Barlow Condensed';color:var(--red)">#18</div></div><div style="text-align:right">8 poin<br><span class="muted">1M 5S 4K · SG -5</span></div></div>
 <h2 class="sub">Berita terbaru</h2>${NEWS.slice(0,2).map(n=>`<a class="card" style="display:block;color:inherit;text-decoration:none" href="${n[3]}" target="_blank" rel="noopener noreferrer"><b>${esc(n[0])}</b><div class="muted">${n[2]}</div></a>`).join("")}
 ${notice}`},
jadwal(){const ms=[...new Map(FIX.map(f=>[mk(f.t),ml(f.t)]))];
 const L=FIX.filter(f=>(S.comp==="all"||f.c===S.comp)&&(S.month==="all"||mk(f.t)===S.month));
 return `<h1 class="title">Jadwal</h1>${chips([["all","Semua"],["pl","Premier League"],["ucl","Liga Champions"]],S.comp,"comp")}${chips([["all","Semua bulan"],...ms],S.month,"month")}
 ${L.length?L.map(f=>row(f)).join(""):`<div class="card muted">Tidak ada pertandingan untuk filter ini.</div>`}<p class="muted">Waktu dalam ${zl[S.tz]}. Jadwal bisa berubah karena siaran TV. Kompetisi piala domestik belum tercantum di data ini.</p>`},
live(){const m=FIX.find(f=>Date.now()>=f.t&&Date.now()<f.t+2.2*36e5);
 return `<h1 class="title">Live Match Center</h1>`+(m?`<div class="card"><p><span class="live-dot"></span> Menurut jadwal, Manchester United ${m.ha==="H"?"vs":"@"} ${esc(m.o)} sedang berlangsung.</p><p class="muted">Skor, menit, dan kejadian langsung belum tersedia di versi tautan ini. Pantau di situs resmi Premier League atau aplikasi resmi klub.</p></div>`:`<div class="card" style="text-align:center"><h2 style="font-size:26px">Manchester United tidak sedang bertanding saat ini.</h2><p class="muted">Pertandingan berikutnya: ${upcoming()[0]?`vs ${esc(upcoming()[0].o)}, ${dt(upcoming()[0].t)}, ${tm(upcoming()[0].t)}`:"belum dijadwalkan"}.</p></div>`)+`<p class="muted">Skor live tidak pernah dikarang. Untuk live score otomatis dibutuhkan backend dan API sepak bola (lihat proyek Next.js yang saya buat sebelumnya).</p>`},
skuad(){const L=SQUAD.filter(p=>p[0].toLowerCase().includes(S.q.toLowerCase()));
 return `<h1 class="title">Skuad</h1><input type="search" id="q" placeholder="Cari pemain…" aria-label="Cari pemain" value="${esc(S.q)}">`+Object.keys(POS).map(k=>{const g=L.filter(p=>p[1]===k);return g.length?`<h2 class="sub">${POS[k]}</h2><div class="grid">${g.map(p=>pcard(p)).join("")}</div>`:""}).join("")+(L.length?"":`<div class="card muted" style="margin-top:12px">Pemain tidak ditemukan.</div>`)+`<p class="muted">Daftar ringkas pemain yang konsisten tercantum di sumber media, bukan skuad penuh. Nomor punggung, usia, dan statistik tidak ditampilkan karena belum terverifikasi.</p>`},
klasemen(){const R=[[1,"Arsenal",10,9,0,1,"15-5","+10",27],[2,"Brighton","–","–","–","–","–","–",22],[3,"Manchester City","–","–","–","–","–","–",21],[18,"Manchester United",10,1,5,4,"14-19","-5",8]];
 return `<h1 class="title">Klasemen</h1><div class="card scroll"><table><thead><tr class="muted"><th>#</th><th>Klub</th><th>Main</th><th>M</th><th>S</th><th>K</th><th>Gol</th><th>SG</th><th>Poin</th></tr></thead><tbody>${R.map(r=>`<tr class="${r[0]===18?"me":""}">${r.map((c,i)=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
 <p class="muted">Hanya baris yang terverifikasi dari laporan media setelah pekan ke-10 (8 November). Klasemen 20 klub lengkap dan perubahan posisi membutuhkan API langsung. United berada di zona degradasi, tepat di atas Sunderland dan Crystal Palace.</p>`},
hasil(){return `<h1 class="title">Hasil</h1>${chips([["all","Semua"],["pl","Premier League"],["ucl","Liga Champions"]],S.comp,"comp")}`+RES.filter(m=>S.comp==="all"||m.c===S.comp).map(m=>row(m,1)).join("")+`<p class="muted">Hasil lima pekan terakhir yang terverifikasi. Laga Liga Champions lawan AS Roma (3 November) belum dimasukkan karena skornya belum saya pastikan.</p>`},
berita(){return `<h1 class="title">Berita</h1>${chips([["all","Semua"],["Match News","Match News"],["Club News","Club News"]],S.cat||"all","cat")}`+NEWS.filter(n=>!S.cat||S.cat==="all"||n[1]===S.cat).map(n=>`<article class="card"><span class="pill">${n[1]}</span><h3 style="font-size:21px;margin:8px 0 4px">${esc(n[0])}</h3><div class="muted">${n[2]}</div><a href="${n[3]}" target="_blank" rel="noopener noreferrer">Baca selengkapnya di ${n[2]}</a></article>`).join("")+`<p class="muted">Ringkasan ditulis ulang; artikel lengkap ada di sumber aslinya.</p>`},
favorit(){const L=SQUAD.filter(p=>S.favs.includes(p[0]));return `<h1 class="title">Pemain favorit</h1>`+(L.length?`<div class="grid">${L.map(p=>pcard(p)).join("")}</div>`:`<div class="card muted">Belum ada favorit. Buka Skuad lalu ketuk ☆.</div>`)},
pengaturan(){return `<h1 class="title">Pengaturan</h1>
 <div class="card stack"><h2 style="font-size:22px">Tampilan</h2><div class="chips">${[["dark","Mode gelap"],["light","Mode terang"]].map(([k,l])=>`<button class="chip" aria-pressed="${S.theme===k}" data-set="theme:${k}">${l}</button>`).join("")}</div>
 <label>Zona waktu<select id="tz">${Object.entries({"Asia/Jakarta":"WIB (Jakarta)","Asia/Makassar":"WITA (Makassar)","Asia/Jayapura":"WIT (Jayapura)","Europe/London":"London"}).map(([k,l])=>`<option value="${k}" ${S.tz===k?"selected":""}>${l}</option>`).join("")}</select></label><p class="muted">Bahasa: Bahasa Indonesia.</p></div>
 <div class="card stack"><h2 style="font-size:22px">Pasang di layar utama</h2><p class="muted" style="margin:0">Android (Chrome): menu ⋮ → Tambahkan ke layar utama.<br>iPhone (Safari): Bagikan → Add to Home Screen.</p></div>
 <div class="card stack"><h2 style="font-size:22px">Notifikasi</h2><p class="muted" style="margin:0">Notifikasi push butuh server backend dan tidak bisa dijalankan dari halaman tautan ini. Fitur itu ada di proyek Next.js.</p></div>
 <div class="card stack"><h2 style="font-size:22px">Tentang</h2><p class="muted" style="margin:0">Manchester United Fans PRO. Dibuat oleh Rizza Nahrul Islam. Aplikasi penggemar tidak resmi, tidak berafiliasi dengan Manchester United. Data per ${AS_OF}.</p></div>`}
};
function pcard(p){const f=S.favs.includes(p[0]);return `<div class="card pl"><div><b>${esc(p[0])}</b><div class="muted">${POS[p[1]]}${p[2]?" · "+p[2]:""}</div></div><button class="star" data-fav="${esc(p[0])}" aria-pressed="${f}" aria-label="${f?"Hapus dari favorit":"Tambah ke favorit"} ${esc(p[0])}">${f?"★":"☆"}</button></div>`}
function route(){const h=(location.hash||"#beranda").slice(1);return V[h]?h:"beranda"}
function render(){const r=route();$("#app").innerHTML=V[r]();$("#nav").innerHTML=TABS.map(([k,i,l])=>`<a href="#${k}" ${k===r?'aria-current="page"':""}><b aria-hidden="true">${i}</b>${l}</a>`).join("");
 const q=$("#q");if(q){q.oninput=e=>{S.q=e.target.value;const pos=e.target.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(pos,pos)}}
 const tz=$("#tz");if(tz)tz.onchange=e=>{S.tz=e.target.value;sv("mu-tz",S.tz);render()}}
document.addEventListener("click",e=>{const s=e.target.closest("[data-set]"),f=e.target.closest("[data-fav]");
 if(s){const[k,v]=s.dataset.set.split(":");S[k]=v;if(k==="theme"){sv("mu-theme",v);applyTheme()}render()}
 if(f){const n=f.dataset.fav;S.favs=S.favs.includes(n)?S.favs.filter(x=>x!==n):[...S.favs,n];sv("mu-favs",S.favs);render()}});
addEventListener("hashchange",()=>{render();scrollTo(0,0)});
setInterval(()=>{const c=$("#cd");if(c)c.innerHTML=cdHTML()},1000);
applyTheme();render();
</script>
</body>
</html>
